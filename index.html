<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Euro Pocket">
<meta name="theme-color" content="#0f766e">
<title>Euro Pocket</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#18211f;--mut:#6b7774;--ln:#e2e8e6;--ac:#0f766e;--onac:#fff;--exp:#c2410c;--inc:#15803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101514;--card:#1a2120;--tx:#e8eeec;--mut:#92a09c;--ln:#2a3432;--ac:#2dd4bf;--onac:#06201c;--exp:#fb923c;--inc:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101514;--card:#1a2120;--tx:#e8eeec;--mut:#92a09c;--ln:#2a3432;--ac:#2dd4bf;--onac:#06201c;--exp:#fb923c;--inc:#4ade80;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:12px 14px 96px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.top button,.nav{background:none;border:0;color:var(--tx);font-size:22px;padding:6px 12px;cursor:pointer}
.mon{font-weight:600;font-size:18px;text-transform:capitalize}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.bal{font-size:32px;font-weight:700;margin:2px 0 10px}
.row{display:flex;justify-content:space-between;gap:10px}
.lbl{color:var(--mut);font-size:13px}
.inc{color:var(--inc);font-weight:600}.exp{color:var(--exp);font-weight:600}
h3{margin:0 0 10px;font-size:15px;color:var(--mut);font-weight:600}
.bar{margin:8px 0}.bar .t{display:flex;justify-content:space-between;font-size:14px}
.bar i{display:block;height:6px;border-radius:3px;background:var(--exp);margin-top:3px;opacity:.85}
.day{color:var(--mut);font-size:13px;margin:14px 4px 6px}
.tx{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.tx .m{flex:1;min-width:0}.tx .c{font-weight:600}.tx .n{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{text-align:right}.tx .a small{display:block;color:var(--mut);font-size:12px}
.del{background:none;border:0;color:var(--mut);font-size:18px;padding:4px 6px;cursor:pointer}
.del.arm{color:#fff;background:var(--exp);border-radius:8px;font-size:13px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--onac);border:0;border-radius:28px;padding:15px 22px;font-size:17px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.gear{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:28px;padding:14px 18px;font-size:15px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--tx);padding:9px;border-radius:9px;font-size:15px;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--onac);font-weight:600}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;margin-bottom:10px}
.amt{font-size:28px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chips button{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:18px;padding:8px 13px;font-size:14px;cursor:pointer}
.chips button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.pre{color:var(--mut);font-size:14px;margin:-2px 0 12px;min-height:20px}
.save{width:100%;background:var(--ac);color:var(--onac);border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:600;cursor:pointer}
.ghost{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:12px;font-size:15px;margin-bottom:8px;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k{background:var(--bg);border-radius:12px;padding:10px}.kv{font-weight:700;font-size:17px}.k small{color:var(--mut);font-size:12px}
.tr{display:flex;gap:6px;align-items:flex-end}.tr .c{flex:1;text-align:center}.tr .bb{height:90px;display:flex;align-items:flex-end;gap:2px;justify-content:center}.tr b{display:block;width:40%;min-height:2px;border-radius:3px 3px 0 0}.tr small{font-size:11px;color:var(--mut)}
label{font-size:13px;color:var(--mut);display:block;margin:0 0 4px 2px}
</style></head><body>
<div class="top"><button class="nav" id="pv">‹</button><div class="mon" id="mon"></div><button class="nav" id="nx">›</button></div>
<div class="seg" id="pd"><button data-v="w">Неделя</button><button data-v="m" class="on">Месяц</button></div>
<div class="card"><div class="lbl">Баланс за период, €</div><div class="bal" id="bal"></div>
<div class="row"><div><div class="lbl">Доходы</div><div class="inc" id="si"></div></div><div style="text-align:right"><div class="lbl">Расходы</div><div class="exp" id="se"></div></div></div></div>
<div class="card" id="stt"></div>
<div class="card" id="cats"></div>
<div class="card" id="trd"></div>
<div id="list"></div>
<button class="gear" id="gb">⚙ Курсы</button>
<button class="fab" id="ab">＋ Добавить</button>

<div class="ov" id="ov1"><div class="sh">
<div class="seg" id="tp"><button data-v="exp" class="on">Расход</button><button data-v="inc">Доход</button></div>
<input class="amt" id="am" type="number" inputmode="decimal" placeholder="0.00">
<div class="seg" id="cu"><button data-v="UAH" class="on">₴ UAH</button><button data-v="PLN">zł PLN</button><button data-v="EUR">€ EUR</button></div>
<div class="pre" id="pre"></div>
<div class="chips" id="ch"></div>
<input id="dt" type="date"><input id="nt" type="text" placeholder="Заметка (необязательно)">
<button class="save" id="sv">Сохранить</button>
<button class="ghost" style="margin:8px 0 0" data-close>Отмена</button>
</div></div>

<div class="ov" id="ov2"><div class="sh">
<h3>Курсы валют (сколько за 1 €)</h3>
<label>Гривен за 1 €</label><input id="r1" type="number" inputmode="decimal">
<label>Злотых за 1 €</label><input id="r2" type="number" inputmode="decimal">
<div class="lbl" style="margin-bottom:12px">Курс фиксируется в момент записи операции — старые записи не пересчитываются.</div>
<button class="save" id="rs">Сохранить курсы</button>
<h3 style="margin-top:20px">Резервная копия</h3>
<textarea id="bk" rows="3" placeholder="Сюда вставьте копию для восстановления"></textarea>
<button class="ghost" id="csv">Скопировать таблицей (CSV для Excel)</button>
<button class="ghost" id="ex">Скопировать мои данные</button>
<button class="ghost" id="im">Восстановить из вставленного</button>
<button class="ghost" data-close>Закрыть</button>
</div></div>

<script>
var K='fin_v1',S={tx:[],rates:{UAH:49,PLN:4.25,EUR:1}},AD=new Date(),V='m',armed=null;AD.setHours(12);
var EC=['Еда','Такси','Кафе','Собака','Одежда','Налоги','Квартира','Бухгалтер','Путешествия','Другое'],IC=['Зарплата','Клиенты','Другое'];
var SYM={UAH:'₴',PLN:'zł',EUR:'€'},F={type:'exp',cur:'UAH',cat:'Еда'};
try{var r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function fm(n){return n.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function today(){var d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function range(o){var d,x;if(V==='m'){d=new Date(AD.getFullYear(),AD.getMonth()+o,1,12);x=new Date(d.getFullYear(),d.getMonth()+1,0,12);return{a:ymd(d),b:ymd(x),n:x.getDate(),label:d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'}),short:d.toLocaleDateString('ru-RU',{month:'short'})}}
 d=new Date(AD.getFullYear(),AD.getMonth(),AD.getDate()+o*7-((AD.getDay()+6)%7),12);x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+6,12);
 var f=function(z){return z.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})};return{a:ymd(d),b:ymd(x),n:7,label:f(d)+' – '+f(x),short:f(d)}}
function tot(R){var i=0,e=0;S.tx.forEach(function(t){if(t.date>=R.a&&t.date<=R.b){if(t.type==='inc')i+=t.eur;else e+=t.eur}});return{i:i,e:e}}
function bars(M,T,c,h){var k=Object.keys(M).sort(function(a,b){return M[b]-M[a]});if(!k.length)return '';return '<h3>'+h+'</h3>'+k.map(function(x){return '<div class="bar"><div class="t"><span>'+esc(x)+'</span><span>'+fm(M[x])+' € · '+(M[x]/T*100).toFixed(0)+'%</span></div><i style="width:'+Math.max(2,M[x]/T*100)+'%;background:var(--'+c+')"></i></div>'}).join('')}
function render(){
 var R=range(0);$('mon').textContent=R.label;
 var m=S.tx.filter(function(t){return t.date>=R.a&&t.date<=R.b}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
 var i=0,e=0,by={},bi={};m.forEach(function(t){if(t.type==='inc'){i+=t.eur;bi[t.cat]=(bi[t.cat]||0)+t.eur}else{e+=t.eur;by[t.cat]=(by[t.cat]||0)+t.eur}});
 $('bal').textContent=fm(i-e)+' €';$('si').textContent='+'+fm(i)+' €';$('se').textContent='−'+fm(e)+' €';
 var P=tot(range(-1)),n=R.n,td=today();
 if(td>=R.a&&td<=R.b)n=Math.round((new Date(td+'T12:00:00')-new Date(R.a+'T12:00:00'))/864e5)+1;else if(td<R.a)n=1;
 var big=m.filter(function(t){return t.type==='exp'}).sort(function(a,b){return b.eur-a.eur})[0];
 function dl(c,p,good){if(!p)return '<small>—</small>';var x=(c-p)/p*100;return '<small style="color:var(--'+((x>0)===good?'inc':'exp')+')">'+(x>0?'▲ +':'▼ ')+Math.abs(x).toFixed(0)+'% к прошлому</small>'}
 var T=[['Расходы',fm(e)+' €',dl(e,P.e,false)],['Доходы',fm(i)+' €',dl(i,P.i,true)],['Расход в день',fm(e/n)+' €',''],['Доход в день',fm(i/n)+' €',''],['Накоплено от дохода',i>0?((i-e)/i*100).toFixed(0)+'%':'—',''],['Крупнейший расход',big?fm(big.eur)+' € · '+esc(big.cat):'—',''],['Расходных операций',m.filter(function(t){return t.type==='exp'}).length,''],['Доходных операций',m.filter(function(t){return t.type==='inc'}).length,'']];
 $('stt').innerHTML='<h3>Статистика</h3><div class="g">'+T.map(function(x){return '<div class="k"><div class="lbl">'+x[0]+'</div><div class="kv">'+x[1]+'</div>'+x[2]+'</div>'}).join('')+'</div>';
 $('stt').style.display=m.length?'':'none';
 var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
 $('cats').style.display=m.length?'':'none';
 $('cats').innerHTML=bars(by,e,'exp','Расходы по категориям')+(ks.length&&i>0?'<div style="height:14px"></div>':'')+bars(bi,i,'inc','Доходы по категориям');
 var tr=[],mx=1;for(var q=-5;q<=0;q++){var Rq=range(q),Tq=tot(Rq);tr.push([Rq.short,Tq]);mx=Math.max(mx,Tq.i,Tq.e)}
 $('trd').innerHTML='<h3>'+(V==='m'?'Динамика по месяцам':'Динамика по неделям')+'</h3><div class="tr">'+tr.map(function(x){return '<div class="c"><div class="bb"><b style="height:'+x[1].i/mx*100+'%;background:var(--inc)"></b><b style="height:'+x[1].e/mx*100+'%;background:var(--exp)"></b></div><small>'+x[0]+'</small></div>'}).join('')+'</div><div class="lbl" style="margin-top:6px"><span class="inc">■</span> доходы &nbsp; <span class="exp">■</span> расходы</div>';
 $('trd').style.display=S.tx.length?'':'none';
 var h='',last='';
 m.forEach(function(t){
  if(t.date!==last){last=t.date;h+='<div class="day">'+new Date(t.date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'})+'</div>'}
  var s=t.type==='inc'?'+':'−';
  h+='<div class="tx"><div class="m"><div class="c">'+esc(t.cat)+'</div>'+(t.note?'<div class="n">'+esc(t.note)+'</div>':'')+'</div><div class="a"><span class="'+t.type+'">'+s+fm(t.eur)+' €</span>'+(t.cur!=='EUR'?'<small>'+fm(t.amt)+' '+SYM[t.cur]+'</small>':'')+'</div><button class="del'+(armed===t.id?' arm':'')+'" data-id="'+t.id+'">'+(armed===t.id?'Удалить?':'✕')+'</button></div>'});
 $('list').innerHTML=h||'<div class="empty">В этом периоде записей нет.<br>Нажмите «Добавить».</div>';
}
function chips(){var c=F.type==='exp'?EC:IC;if(c.indexOf(F.cat)<0)F.cat=c[0];
 $('ch').innerHTML=c.map(function(x){return '<button data-c="'+x+'"'+(x===F.cat?' class="on"':'')+'>'+x+'</button>'}).join('')}
function pre(){var a=parseFloat($('am').value),r=S.rates[F.cur];
 $('pre').textContent=a>0&&F.cur!=='EUR'?'≈ '+fm(a/r)+' € (курс '+r+')':''}
function seg(id,key,fn){$(id).onclick=function(ev){var b=ev.target.closest('button');if(!b)return;
 [].forEach.call($(id).children,function(x){x.classList.toggle('on',x===b)});F[key]=b.dataset.v;fn()}}
seg('tp','type',function(){chips();pre()});seg('cu','cur',pre);
$('ch').onclick=function(ev){var b=ev.target.closest('button');if(!b)return;F.cat=b.dataset.c;chips()};
$('am').oninput=pre;
function open(id){$(id).classList.add('on')}
function closeAll(){[].forEach.call(document.querySelectorAll('.ov'),function(o){o.classList.remove('on')})}
[].forEach.call(document.querySelectorAll('[data-close]'),function(b){b.onclick=closeAll});
$('ab').onclick=function(){$('am').value='';$('nt').value='';$('dt').value=today();chips();pre();open('ov1');setTimeout(function(){$('am').focus()},50)};
$('sv').onclick=function(){var a=parseFloat($('am').value);if(!(a>0)){$('am').focus();return}
 var r=S.rates[F.cur];S.tx.push({id:Date.now(),type:F.type,amt:a,cur:F.cur,rate:r,eur:a/r,cat:F.cat,date:$('dt').value||today(),note:$('nt').value.trim()});
 save();AD=new Date(S.tx[S.tx.length-1].date+'T12:00:00');closeAll();render()};
$('list').onclick=function(ev){var b=ev.target.closest('.del');if(!b)return;var id=+b.dataset.id;
 if(armed===id){S.tx=S.tx.filter(function(t){return t.id!==id});armed=null;save()}else armed=id;render()};
function shift(n){if(V==='m'){AD.setDate(1);AD.setMonth(AD.getMonth()+n)}else AD.setDate(AD.getDate()+7*n);armed=null;render()}
$('pd').onclick=function(ev){var b=ev.target.closest('button');if(!b)return;V=b.dataset.v;[].forEach.call($('pd').children,function(x){x.classList.toggle('on',x===b)});armed=null;render()};
$('pv').onclick=function(){shift(-1)};$('nx').onclick=function(){shift(1)};
$('gb').onclick=function(){$('r1').value=S.rates.UAH;$('r2').value=S.rates.PLN;open('ov2')};
$('rs').onclick=function(){var a=parseFloat($('r1').value),b=parseFloat($('r2').value);if(a>0&&b>0){S.rates.UAH=a;S.rates.PLN=b;save();closeAll()}};
$('csv').onclick=function(){var q=function(v){return '"'+String(v).replace(/"/g,'""')+'"'};
 var L=['date,type,category,amount,currency,rate_per_eur,eur,note'];
 S.tx.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(t){L.push([t.date,t.type==='inc'?'income':'expense',q(t.cat),t.amt.toFixed(2),t.cur,t.rate,t.eur.toFixed(2),q(t.note||'')].join(','))});
 var t=L.join('\n');$('bk').value=t;$('bk').select();try{navigator.clipboard.writeText(t)}catch(e){}};
$('ex').onclick=function(){var t=JSON.stringify(S);$('bk').value=t;$('bk').select();try{navigator.clipboard.writeText(t)}catch(e){}};
$('im').onclick=function(){try{var o=JSON.parse($('bk').value);if(o&&o.tx&&o.rates){S=o;save();closeAll();render()}}catch(e){$('bk').value='Не удалось прочитать копию'}};
render();
</script></body></html>
